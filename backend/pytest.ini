[pytest]
# MindFlow Backend Test Configuration
# Per SDLC Phase 7 - Testing & Quality Assurance

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for pytest-asyncio
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database and services)
    rbac: Role-based access control tests
    rls: Row-level security tests
    security: Security vulnerability tests
    negative: Negative and abuse case tests
    slow: Slow running tests

# Coverage configuration
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    --cov=services
    --cov=shared
    --cov-report=term-missing
    --cov-report=html:coverage/html
    --cov-report=xml:coverage/coverage.xml
    --cov-fail-under=80

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# Timeout for tests (5 minutes max per test)
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
