# =============================================================================
# MindFlow Centralized Alembic Configuration
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for all database migrations.
#
# RULES:
# 1. ALL schema changes MUST go through Alembic
# 2. NO direct SQL modifications in production
# 3. NO Prisma migrations (Prisma is read-only)
# 4. Run migrations via: alembic upgrade head
# =============================================================================

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Truncate the "slug" field at this length
truncate_slug_length = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
