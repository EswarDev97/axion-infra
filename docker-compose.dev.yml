# Development override - run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  # Backend Python services
  auth-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/auth:/app/services/auth:ro
    command: uvicorn services.auth.main:app --reload --host 0.0.0.0 --port 8101

  storage-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/storage:/app/services/storage:ro
    command: uvicorn services.storage.main:app --reload --host 0.0.0.0 --port 8110

  hr-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/hr:/app/services/hr:ro
    command: uvicorn services.hr.main:app --reload --host 0.0.0.0 --port 8102

  task-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/task:/app/services/task:ro
    command: uvicorn services.task.main:app --reload --host 0.0.0.0 --port 8103

  training-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/training:/app/services/training:ro
    command: uvicorn services.training.main:app --reload --host 0.0.0.0 --port 8104

  expense-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - AUTO_FINANCE_APPROVAL=true
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/expense:/app/services/expense:ro
    command: uvicorn services.expense.main:app --reload --host 0.0.0.0 --port 8105

  mindmap-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/mindmap:/app/services/mindmap:ro
    command: uvicorn services.mindmap.main:app --reload --host 0.0.0.0 --port 8106

  complaint-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/complaint:/app/services/complaint:ro
    command: uvicorn services.complaint.main:app --reload --host 0.0.0.0 --port 8107

  approval-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/approval:/app/services/approval:ro
    command: uvicorn services.approval.main:app --reload --host 0.0.0.0 --port 8108

  notification-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/notification:/app/services/notification:ro
    command: uvicorn services.notification.main:app --reload --host 0.0.0.0 --port 8109

  report-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/report:/app/services/report:ro
    command: uvicorn services.report.main:app --reload --host 0.0.0.0 --port 8111

  billing-service:
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend/shared:/app/shared:ro
      - ./backend/services/billing:/app/services/billing:ro
    command: uvicorn services.billing.main:app --reload --host 0.0.0.0 --port 8112

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./api-gateway/src:/app/src:ro
      - ./api-gateway/prisma:/app/prisma:ro
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1
      - API_BASE_URL_INTERNAL=http://api-gateway:3001/api/v1
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    command: npm run dev

  ai-resume-parser:
    build:
      context: ./ai-services/resume-parser
      dockerfile: Dockerfile.dev
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./ai-services/resume-parser/app:/app/app:ro
      - ./ai-services/shared:/app/shared:ro
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001

  ai-document-classifier:
    build:
      context: ./ai-services/document-classifier
      dockerfile: Dockerfile.dev
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./ai-services/document-classifier/app:/app/app:ro
      - ./ai-services/shared:/app/shared:ro
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8002

  ai-hr-analytics:
    build:
      context: ./ai-services/hr-analytics
      dockerfile: Dockerfile.dev
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./ai-services/hr-analytics/app:/app/app:ro
      - ./ai-services/shared:/app/shared:ro
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8003

  # Disable nginx in development - access services directly
  nginx:
    profiles:
      - production
