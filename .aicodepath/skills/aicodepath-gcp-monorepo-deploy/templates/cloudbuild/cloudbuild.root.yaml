# cloudbuild.yaml - Root build configuration for monorepo
# Auto-generated by gcp-monorepo-deploy skill
#
# This is a reference template. Copy to your project root and customize.
# Change detection builds only modified services for efficient CI/CD.

steps:
  # Step 1: Detect changed services
  - name: 'gcr.io/cloud-builders/git'
    id: 'detect-changes'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Detecting changed services..."

        if [ "$_DEPLOY_ALL" = "true" ]; then
          echo "Deploy-all flag set - deploying all services"
          yq eval '.services[].name' services.yaml > /workspace/changed_services.txt
        else
          # Detect changes from git diff
          CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed files detected"
            touch /workspace/changed_services.txt
            exit 0
          fi

          echo "$CHANGED_FILES" | grep -oP '^[^/]+/[^/]+' | sort -u > /workspace/changed_dirs.txt || true

          # Match changed directories against services.yaml entries
          > /workspace/changed_services.txt
          while IFS= read -r svc; do
            svc_path=$(yq eval ".services[] | select(.name == \"$svc\") | .path" services.yaml)
            if grep -q "^${svc_path}" /workspace/changed_dirs.txt 2>/dev/null; then
              echo "$svc_path" >> /workspace/changed_services.txt
            fi
          done < <(yq eval '.services[].name' services.yaml)

          if [ ! -s /workspace/changed_services.txt ]; then
            echo "No service changes detected"
            exit 0
          fi
        fi

        echo "Services to build:"
        cat /workspace/changed_services.txt

  # Step 2: Build changed services
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -s /workspace/changed_services.txt ]; then
          echo "No services to build"
          exit 0
        fi

        while IFS= read -r service_path; do
          SERVICE_NAME=$(basename "$service_path")
          echo "Building $SERVICE_NAME..."

          docker build \
            -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/$SERVICE_NAME:${SHORT_SHA}" \
            -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/$SERVICE_NAME:latest" \
            "$service_path"

          echo "Built $SERVICE_NAME"
        done < /workspace/changed_services.txt

  # Step 3: Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -s /workspace/changed_services.txt ]; then
          echo "No images to push"
          exit 0
        fi

        while IFS= read -r service_path; do
          SERVICE_NAME=$(basename "$service_path")
          echo "Pushing $SERVICE_NAME..."

          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/$SERVICE_NAME:${SHORT_SHA}"
          docker push "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/$SERVICE_NAME:latest"

          echo "Pushed $SERVICE_NAME"
        done < /workspace/changed_services.txt

  # Step 4: Deploy to environment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -s /workspace/changed_services.txt ]; then
          echo "No services to deploy"
          exit 0
        fi

        # Determine environment from branch
        case "$BRANCH_NAME" in
          dev)       ENV="dev";     TARGET_PROJECT="${_DEV_PROJECT}" ;;
          staging)   ENV="staging"; TARGET_PROJECT="${_STG_PROJECT}" ;;
          main)      ENV="prod";    TARGET_PROJECT="${_PROD_PROJECT}" ;;
          *)
            echo "Unknown branch: $BRANCH_NAME - skipping deploy"
            exit 0
            ;;
        esac

        echo "Deploying to $ENV environment (project: $TARGET_PROJECT)"

        while IFS= read -r service_path; do
          SERVICE_NAME=$(basename "$service_path")
          echo "Deploying $SERVICE_NAME..."

          gcloud run deploy "$SERVICE_NAME-$ENV" \
            --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/$SERVICE_NAME:${SHORT_SHA}" \
            --platform=managed \
            --region="${_REGION}" \
            --project="$TARGET_PROJECT" \
            --set-env-vars="ENV=$ENV,SERVICE_NAME=$SERVICE_NAME" \
            --timeout=300s \
            --quiet

          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME-$ENV" \
            --region="${_REGION}" \
            --project="$TARGET_PROJECT" \
            --format='value(status.url)')

          echo "Deployed $SERVICE_NAME to $ENV: $SERVICE_URL"
        done < /workspace/changed_services.txt

  # Step 5: Run health checks
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'health-checks'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ ! -s /workspace/changed_services.txt ]; then
          echo "No services to check"
          exit 0
        fi

        echo "Running health checks..."

        case "$BRANCH_NAME" in
          dev)       ENV="dev";     TARGET_PROJECT="${_DEV_PROJECT}" ;;
          staging)   ENV="staging"; TARGET_PROJECT="${_STG_PROJECT}" ;;
          main)      ENV="prod";    TARGET_PROJECT="${_PROD_PROJECT}" ;;
          *) exit 0 ;;
        esac

        FAILED=0

        while IFS= read -r service_path; do
          SERVICE_NAME=$(basename "$service_path")

          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME-$ENV" \
            --region="${_REGION}" \
            --project="$TARGET_PROJECT" \
            --format='value(status.url)' 2>/dev/null || echo "")

          if [ -z "$SERVICE_URL" ]; then
            echo "Could not get URL for $SERVICE_NAME"
            FAILED=$((FAILED + 1))
            continue
          fi

          echo "Checking $SERVICE_NAME at $SERVICE_URL/health"

          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "$SERVICE_NAME is healthy"
              break
            else
              if [ "$i" -eq 5 ]; then
                echo "$SERVICE_NAME health check failed (HTTP $HTTP_CODE)"
                FAILED=$((FAILED + 1))
              else
                echo "Waiting for $SERVICE_NAME to be ready... (attempt $i/5)"
                sleep 10
              fi
            fi
          done
        done < /workspace/changed_services.txt

        if [ "$FAILED" -gt 0 ]; then
          echo "$FAILED service(s) failed health checks"
          exit 1
        fi

        echo "All services healthy"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
  dynamic_substitutions: true

substitutions:
  _REGION: us-central1
  _ARTIFACT_REPO: docker-repo
  _DEV_PROJECT: ''
  _STG_PROJECT: ''
  _PROD_PROJECT: ''
  _DEPLOY_ALL: 'false'

timeout: '1800s'

tags:
  - 'monorepo'
  - 'automated-deployment'
