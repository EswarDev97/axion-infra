# Staging Environment Configuration
# Auto-generated by gcp-monorepo-deploy skill
#
# Staging environment: min 1 instance, approval required, info logging.
# Replace {{PLACEHOLDERS}} with actual values.

environment: staging

gcp:
  project_id: "{{STG_PROJECT}}"
  region: "{{REGION}}"
  artifact_repo: docker-repo

deployment:
  auto_deploy: true
  approval_required: true
  rollback_on_failure: true

services:
  # Global defaults for staging
  defaults:
    min_instances: 1
    max_instances: 5
    cpu: "2"
    memory: "1Gi"
    timeout: "120s"
    concurrency: 80

  # Service-specific overrides (add per service)
  # api-gateway:
  #   min_instances: 2
  #   env_vars:
  #     LOG_LEVEL: info
  #   secrets:
  #     - name: API_KEY
  #       secret: api-gateway-key-staging
  #       version: latest

monitoring:
  enabled: true
  log_level: info
  trace_sampling: 0.1  # 10% sampling in staging
  alert_thresholds:
    error_rate: 0.05    # 5%
    latency_p99: 2000   # 2 seconds

notifications:
  enabled: true
  channels:
    - slack-staging
