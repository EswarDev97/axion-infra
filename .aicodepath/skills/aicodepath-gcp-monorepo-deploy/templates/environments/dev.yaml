# Development Environment Configuration
# Auto-generated by gcp-monorepo-deploy skill
#
# Dev environment: scale-to-zero, auto-deploy, debug logging.
# Replace {{PLACEHOLDERS}} with actual values.

environment: dev

gcp:
  project_id: "{{DEV_PROJECT}}"
  region: "{{REGION}}"
  artifact_repo: docker-repo

deployment:
  auto_deploy: true
  approval_required: false
  rollback_on_failure: true

services:
  # Global defaults for dev
  defaults:
    min_instances: 0
    max_instances: 3
    cpu: "1"
    memory: "512Mi"
    timeout: "60s"
    concurrency: 80

  # Service-specific overrides (add per service)
  # api-gateway:
  #   min_instances: 1
  #   env_vars:
  #     LOG_LEVEL: debug
  #   secrets:
  #     - name: API_KEY
  #       secret: api-gateway-key-dev
  #       version: latest

monitoring:
  enabled: true
  log_level: debug
  trace_sampling: 1.0  # 100% sampling in dev
  alert_thresholds:
    error_rate: 0.1     # 10% - lenient for dev
    latency_p99: 5000   # 5 seconds

notifications:
  enabled: false  # No notifications for dev
