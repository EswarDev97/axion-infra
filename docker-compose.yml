services:
  # ============================================================================
  # INFRASTRUCTURE SERVICES
  # ============================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: axionpcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axionpcs
      POSTGRES_PASSWORD: axionpcs_secret
      POSTGRES_DB: axionpcs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axionpcs -d axionpcs_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axionpcs-network

  redis:
    image: redis:7-alpine
    container_name: axionpcs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - axionpcs-network

  minio:
    image: minio/minio:latest
    container_name: axionpcs-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: axionpcs_minio
      MINIO_ROOT_PASSWORD: axionpcs_minio_secret
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"   # API (9000 in use by inspectaone-minio)
      - "9011:9001"   # Console (9001 in use by inspectaone-minio)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - axionpcs-network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: axionpcs-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 axionpcs_minio axionpcs_minio_secret;
      mc mb myminio/axionpcs-documents --ignore-existing;
      mc mb myminio/axionpcs-avatars --ignore-existing;
      mc anonymous set download myminio/axionpcs-avatars;
      exit 0;
      "
    networks:
      - axionpcs-network

  # ============================================================================
  # BACKEND MICROSERVICES (Python/FastAPI)
  # ============================================================================

  auth-service:
    build:
      context: ./backend
      dockerfile: services/auth/Dockerfile
    container_name: axionpcs-auth-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8101
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  storage-service:
    build:
      context: ./backend
      dockerfile: services/storage/Dockerfile
    container_name: axionpcs-storage-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8110
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=axionpcs_minio
      - MINIO_SECRET_KEY=axionpcs_minio_secret
      - MINIO_SECURE=false
    ports:
      - "8110:8110"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8110/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  hr-service:
    build:
      context: ./backend
      dockerfile: services/hr/Dockerfile
    container_name: axionpcs-hr-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8102
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  task-service:
    build:
      context: ./backend
      dockerfile: services/task/Dockerfile
    container_name: axionpcs-task-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8103
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8103/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  training-service:
    build:
      context: ./backend
      dockerfile: services/training/Dockerfile
    container_name: axionpcs-training-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8104
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
      - STORAGE_SERVICE_URL=http://storage-service:8110
    ports:
      - "8104:8104"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  expense-service:
    build:
      context: ./backend
      dockerfile: services/expense/Dockerfile
    container_name: axionpcs-expense-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8105
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
      - STORAGE_SERVICE_URL=http://storage-service:8110
      - AUTO_FINANCE_APPROVAL=true
    ports:
      - "8105:8105"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8105/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  mindmap-service:
    build:
      context: ./backend
      dockerfile: services/mindmap/Dockerfile
    container_name: axionpcs-mindmap-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8106
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
      - STORAGE_SERVICE_URL=http://storage-service:8110
      - TASK_SERVICE_URL=http://task-service:8103
    ports:
      - "8106:8106"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8106/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  complaint-service:
    build:
      context: ./backend
      dockerfile: services/complaint/Dockerfile
    container_name: axionpcs-complaint-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8107
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
      - STORAGE_SERVICE_URL=http://storage-service:8110
      - NOTIFICATION_SERVICE_URL=http://notification-service:8109
    ports:
      - "8107:8107"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8107/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  approval-service:
    build:
      context: ./backend
      dockerfile: services/approval/Dockerfile
    container_name: axionpcs-approval-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8108
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
      - NOTIFICATION_SERVICE_URL=http://notification-service:8109
    ports:
      - "8108:8108"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  notification-service:
    build:
      context: ./backend
      dockerfile: services/notification/Dockerfile
    container_name: axionpcs-notification-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8109
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
    ports:
      - "8109:8109"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8109/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  report-service:
    build:
      context: ./backend
      dockerfile: services/report/Dockerfile
    container_name: axionpcs-report-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8111
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
    ports:
      - "8111:8111"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8111/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  billing-service:
    build:
      context: ./backend
      dockerfile: services/billing/Dockerfile
    container_name: axionpcs-billing-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8112
      - DATABASE_URL=postgresql+asyncpg://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8101
    ports:
      - "8112:8112"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8112/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  # ============================================================================
  # APPLICATION SERVICES (Node.js)
  # ============================================================================

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: axionpcs-api-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - AI_SERVICE_RESUME_PARSER_URL=http://ai-resume-parser:8001
      - AI_SERVICE_DOCUMENT_CLASSIFIER_URL=http://ai-document-classifier:8002
      - AI_SERVICE_HR_ANALYTICS_URL=http://ai-hr-analytics:8003
    env_file:
      - ./api-gateway/.env
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1
    container_name: axionpcs-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1
      - API_BASE_URL_INTERNAL=http://api-gateway:3001/api/v1
    ports:
      - "3002:3002"
    depends_on:
      - api-gateway
    networks:
      - axionpcs-network

  # ============================================================================
  # AI SERVICES
  # ============================================================================

  ai-resume-parser:
    build:
      context: ./ai-services/resume-parser
      dockerfile: Dockerfile
    container_name: axionpcs-ai-resume-parser
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8001
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=axionpcs_minio
      - MINIO_SECRET_KEY=axionpcs_minio_secret
    env_file:
      - ./ai-services/.env
    ports:
      - "8011:8001"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  ai-document-classifier:
    build:
      context: ./ai-services/document-classifier
      dockerfile: Dockerfile
    container_name: axionpcs-ai-document-classifier
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8002
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=axionpcs_minio
      - MINIO_SECRET_KEY=axionpcs_minio_secret
    env_file:
      - ./ai-services/.env
    ports:
      - "8012:8002"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  ai-hr-analytics:
    build:
      context: ./ai-services/hr-analytics
      dockerfile: Dockerfile
    container_name: axionpcs-ai-hr-analytics
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=8003
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://axionpcs:axionpcs_secret@postgres:5432/axionpcs_db
    env_file:
      - ./ai-services/.env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - axionpcs-network

  # NOTE: Nginx is handled by the host Nginx on this server.
  # A server block will be added to /etc/nginx/conf.d/ once the domain is mapped.
  # frontend  -> http://localhost:3002
  # api-gateway -> http://localhost:3001

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  axionpcs-network:
    driver: bridge
    name: axionpcs-network
