# Production Environment Configuration
# Auto-generated by gcp-monorepo-deploy skill
#
# Production environment: min 2+ instances, manual trigger, warn logging, alerts.
# Replace {{PLACEHOLDERS}} with actual values.

environment: prod

gcp:
  project_id: "{{PROD_PROJECT}}"
  region: "{{REGION}}"
  artifact_repo: docker-repo

deployment:
  auto_deploy: false
  approval_required: true
  rollback_on_failure: true

services:
  # Global defaults for production
  defaults:
    min_instances: 2
    max_instances: 20
    cpu: "2"
    memory: "2Gi"
    timeout: "300s"
    concurrency: 100

  # Service-specific overrides (add per service)
  # api-gateway:
  #   min_instances: 3
  #   max_instances: 50
  #   cpu: "4"
  #   memory: "4Gi"
  #   env_vars:
  #     LOG_LEVEL: warn
  #   secrets:
  #     - name: API_KEY
  #       secret: api-gateway-key-prod
  #       version: latest

monitoring:
  enabled: true
  log_level: warn
  trace_sampling: 0.01  # 1% sampling in prod
  alert_thresholds:
    error_rate: 0.01    # 1% - strict for production
    latency_p99: 1000   # 1 second

notifications:
  enabled: true
  channels:
    - slack-production
    - pagerduty
    - email-oncall
